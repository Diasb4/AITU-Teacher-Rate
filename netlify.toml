[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_SUPABASE_URL = "https://eexyrygatojgxmwhfgka.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_lW13Ralei8f_iIQs2FRdzA_CDwYz5eN"

# SPA Client-Side Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control headers for production assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
